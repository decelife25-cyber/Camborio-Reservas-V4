<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Actualizando Camborio Reservas</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;color:#20252b}
    main{text-align:center;padding:28px;max-width:420px}
    h1{font-size:22px;margin:0 0 10px}
    p{line-height:1.5;margin:0;color:#5d6670}
  </style>
</head>
<body>
<main>
  <h1>Actualizando Camborio Reservas…</h1>
  <p>Limpiando la versión antigua y cargando la versión actual.</p>
</main>
<script>
(async function(){
  const prefix='camborio-public-v4-';
  try {
    const registrations=await navigator.serviceWorker.getRegistrations();
    await Promise.all(registrations.map(r=>r.unregister()));
  } catch(e) {}
  try {
    const keys=await caches.keys();
    await Promise.all(keys.filter(k=>k.startsWith(prefix)).map(k=>caches.delete(k)));
  } catch(e) {}
  try {
    if('serviceWorker' in navigator){
      await navigator.serviceWorker.register('./sw-v4-reset.js?reset=20260905');
      if(navigator.serviceWorker.ready) await navigator.serviceWorker.ready;
    }
  } catch(e) {}
  location.replace('./index.html?reset='+Date.now());
})();
</script>
</body>
</html>
