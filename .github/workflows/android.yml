name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android_app/**'
      - 'reservas_apk.png'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android_app/**'
      - 'reservas_apk.png'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: |
        cd android_app
        npm ci

    - name: Build Web Assets
      run: |
        cd android_app
        npm run build

    - name: Sync Capacitor
      run: |
        cd android_app
        npx cap sync android

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Apply official private APK icon
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y imagemagick

        SRC="reservas_apk.png"
        RES="android_app/android/app/src/main/res"

        # Keep the official source image unchanged for the launcher asset.
        # Android adaptive icons mask the foreground, so the foreground needs
        # a safe margin to keep the complete artwork visible on the launcher.
        declare -A SIZES=(
          [mipmap-mdpi]=48
          [mipmap-hdpi]=72
          [mipmap-xhdpi]=96
          [mipmap-xxhdpi]=144
          [mipmap-xxxhdpi]=192
        )

        for DIR in "${!SIZES[@]}"; do
          SIZE="${SIZES[$DIR]}"

          # Legacy launcher resources: preserve the complete official artwork.
          convert "$SRC" -resize "${SIZE}x${SIZE}" "$RES/$DIR/ic_launcher.png"
          convert "$SRC" -resize "${SIZE}x${SIZE}" "$RES/$DIR/ic_launcher_round.png"

          # Adaptive-icon foreground: inset the complete artwork so the
          # launcher mask does not crop the outer frame or the book.
          convert "$SRC"             -resize "70%x70%"             -gravity center             -background "#f7f1e5"             -extent "${SIZE}x${SIZE}"             "$RES/$DIR/ic_launcher_foreground.png"
        done

    - name: Verify stable signing key
      run: |
        test -f android_app/android/app/camborio-debug.keystore

    - name: Build APK
      run: |
        cd android_app/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android_app/android/app/build/outputs/apk/debug/app-debug.apk
