name: Import Camborio logo once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-logo:
    if: ${{ !contains(github.event.head_commit.message, 'chore: import Camborio logo') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import logo from stable public project
        run: |
          mkdir -p logo
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/decelife25-cyber/Camborio-Reservas-Publico/main/logocamborio_trans.png \
            -o logo/camborio.png
          test -s logo/camborio.png
      - name: Commit logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo/camborio.png
          git commit -m "chore: import Camborio logo"
          git push
