name: Fix original Camborio logo transparency

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-logo:
    if: ${{ startsWith(github.event.head_commit.message, 'chore(bot): transparent original logo') == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove only connected background
        run: |
          python -m pip install --quiet Pillow
          python <<'PY'
          from collections import Counter, deque
          from pathlib import Path
          from PIL import Image

          path = Path('logocamborio_trans.png')
          im = Image.open(path).convert('RGBA')
          w, h = im.size
          px = im.load()

          edge = []
          for x in range(w):
              edge.append(px[x, 0][:3])
              edge.append(px[x, h - 1][:3])
          for y in range(1, h - 1):
              edge.append(px[0, y][:3])
              edge.append(px[w - 1, y][:3])

          def quant(c):
              return tuple((v // 8) * 8 for v in c)

          bg = Counter(quant(c) for c in edge).most_common(1)[0][0]
          tolerance = 52
          tolerance_sq = tolerance * tolerance

          def close_to_bg(rgb):
              dr = rgb[0] - bg[0]
              dg = rgb[1] - bg[1]
              db = rgb[2] - bg[2]
              return dr * dr + dg * dg + db * db <= tolerance_sq

          q = deque()
          seen = bytearray(w * h)

          def push(x, y):
              i = y * w + x
              if seen[i]:
                  return
              seen[i] = 1
              if px[x, y][3] > 0 and close_to_bg(px[x, y][:3]):
                  q.append((x, y))

          for x in range(w):
              push(x, 0)
              push(x, h - 1)
          for y in range(1, h - 1):
              push(0, y)
              push(w - 1, y)

          removed = 0
          while q:
              x, y = q.popleft()
              r, g, b, a = px[x, y]
              if a:
                  px[x, y] = (r, g, b, 0)
                  removed += 1
              if x > 0: push(x - 1, y)
              if x + 1 < w: push(x + 1, y)
              if y > 0: push(x, y - 1)
              if y + 1 < h: push(x, y + 1)

          im.save(path, format='PNG', optimize=True)
          print(f'Original dimensions preserved: {w}x{h}')
          print(f'Connected background pixels made transparent: {removed}')
          print(f'Detected background colour: {bg}')
          PY

      - name: Commit processed original logo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add logocamborio_trans.png
          if git diff --cached --quiet; then
            echo 'No logo change was necessary.'
            exit 0
          fi
          git commit -m 'chore(bot): transparent original logo'
          git push
