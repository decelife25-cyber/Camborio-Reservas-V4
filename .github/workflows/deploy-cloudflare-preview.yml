name: Preview Camborio Reservas V4 on Cloudflare

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy V4 preview to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy Cloudflare Pages preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=camborio-reservas-v4 --branch=${{ github.head_ref }} --commit-hash=${{ github.event.pull_request.head.sha }} --commit-message="PR preview Camborio Reservas V4"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
